              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: SEED_USERNAME
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: SEED_USER_PASSWORD
          volumeMounts:
            - name: conv-api-data
              mountPath: /opt/app/uploads
      volumes:
        - name: conv-api-data
          persistentVolumeClaim:
            claimName: conv-api-pvc
