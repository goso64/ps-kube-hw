apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: converter
  annotations:
    nginx.ingress.kubernetes.io/add-base-url: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: conv.test
    http:
      paths:
      - pathType: Prefix
        {{- with .Values.app }}
        path: "/"
        backend:
          service:
            name: "{{ .name }}-clusterip"
            port:
              number: {{ .port }}
        {{- end }}
      - pathType: Prefix
        {{- with .Values.api }}
        path: "/api"
        backend:
          service:
            name: "{{ .name }}-clusterip"
            port:
              number: {{ .port }}
        {{- end -}}